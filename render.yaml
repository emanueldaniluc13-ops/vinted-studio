# Render > New > Blueprint: crea el backend gratuito a partir de este archivo.
services:
  - type: web
    name: vinted-studio-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: WEB_ORIGIN
        sync: false
